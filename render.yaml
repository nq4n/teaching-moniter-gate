# Render blueprint — منار / Teaching Monitor
# Database: Supabase Postgres. Use the SESSION POOLER connection string
# (IPv4-compatible, port 5432) — the direct db.<ref>.supabase.co host is IPv6-only
# and Render cannot reach it. Paste it into DATABASE_URL below.
services:
  - type: web
    name: manar
    runtime: python
    # NOT free: on Render's free plan the service sleeps after ~15 minutes idle
    # and the next request takes ~50s to wake it. That is fine for a demo and
    # unacceptable at the start of a lesson, when a whole class opens the exam
    # link at once. Keep a paid plan for anything students actually sit.
    plan: starter
    region: singapore              # closest Render region to the Tokyo (ap-northeast-1) Supabase DB
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true          # Render generates a strong random key
        # Generated once and kept. Changing it signs out every teacher AND
        # every student mid-exam, so do not rotate it on an exam day.
      - key: MAX_UPLOAD_MB
        value: "8"
      - key: DATABASE_URL
        sync: false                   # paste the Supabase SESSION POOLER connection string here
      # Optional first admin account (otherwise just register from the login page):
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SCHOOL_NAME
        sync: false
