<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متابعة الدرجات</title>
<style>
:root{
    --bg:#0f172a;
    --sidebar:#111827;
    --card:#1e293b;
    --card2:#243447;
    --primary:#3b82f6;
    --success:#22c55e;
    --danger:#ef4444;
    --warning:#f59e0b;
    --text:#f8fafc;
    --muted:#94a3b8;
    --border:#334155;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Tahoma,sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

.app{
    display:flex;
    height:100vh;
}

.sidebar{
    width:300px;
    background:var(--sidebar);
    border-left:1px solid var(--border);
    overflow:auto;
    padding:20px;
}

.logo{
    font-size:20px;
    font-weight:bold;
    margin-bottom:20px;
}

.add-controls{
    display:flex;
    gap:8px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    background:var(--primary);
    color:white;
    padding:10px 12px;
    border-radius:10px;
    cursor:pointer;
    transition:.2s;
    font-size:13px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    flex:1;
    min-width:100px;
}

.btn:hover{
    opacity:.9;
}

.btn-success{
    background:var(--success);
}

.grade{
    margin-bottom:15px;
}

.grade-title{
    color:#60a5fa;
    font-weight:bold;
    font-size:14px;
    margin-bottom:8px;
}

.section{
    background:var(--card);
    padding:10px;
    border-radius:8px;
    margin-bottom:6px;
    cursor:pointer;
    transition:.2s;
    font-size:13px;
}

.section:hover{
    background:var(--card2);
}

.section.active{
    border:2px solid var(--primary);
    background:var(--card2);
}

.main{
    flex:1;
    padding:25px;
    overflow:auto;
    display:flex;
    flex-direction:column;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    flex-wrap:wrap;
    gap:15px;
}

.page-title{
    font-size:28px;
    font-weight:bold;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.tab{
    background:var(--card);
    border:none;
    color:white;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    font-weight:500;
    transition:.2s;
}

.tab.active{
    background:var(--primary);
}

.tab-content{
    flex:1;
    overflow:auto;
}

.content{
    flex:1;
    overflow:auto;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
    margin-bottom:20px;
}

.stat-card{
    background:var(--card);
    border-radius:12px;
    padding:20px;
    border:1px solid var(--border);
}

.stat-title{
    color:var(--muted);
    font-size:13px;
}

.stat-value{
    margin-top:10px;
    font-size:28px;
    font-weight:bold;
}

.lesson-card{
    background:var(--card);
    margin-bottom:10px;
    border-radius:8px;
    padding:15px;
    border:1px solid var(--border);
}

.lesson-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.lesson-title{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:15px;
}

.lesson-title input{
    width:18px;
    height:18px;
    cursor:pointer;
}

.lesson-title label{
    cursor:pointer;
}

.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:rgba(0,0,0,.7);
    z-index:1000;
    align-items:center;
    justify-content:center;
}

.modal.active{
    display:flex;
}

.modal-content{
    background:var(--card);
    border-radius:12px;
    padding:25px;
    width:90%;
    max-width:500px;
    max-height:90vh;
    overflow:auto;
}

.modal-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    margin-bottom:5px;
    font-size:14px;
}

.form-group input,
.form-group select{
    width:100%;
    padding:8px;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--bg);
    color:white;
    font-size:13px;
}

.modal-buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.modal-buttons button{
    flex:1;
    padding:10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.btn-close{
    background:var(--card2);
    color:white;
}

.btn-confirm{
    background:var(--success);
    color:white;
}
</style>
</head>
<body>
<div class="app">
    <div class="sidebar">
        <div class="logo">📚 المراقبة</div>

        <div class="add-controls">
            <button class="btn btn-success" onclick="openMachineMode()">⚡ إضافة سريعة</button>
            <button class="btn" onclick="openEditMode()">✏️ تعديل</button>
        </div>

        <div id="grades-sidebar"></div>
    </div>

    <div class="main">
        <div class="topbar">
            <div>
                <div class="page-title" id="page-title">الصف 5</div>
            </div>
            <button class="btn" onclick="logout()">🚪 خروج</button>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('lessons')">📚 الدروس</button>
            <button class="tab" onclick="switchTab('stats')">📊 الإحصائيات</button>
        </div>

        <div class="content">
            <div id="lessons-tab" class="tab-content">
                <div id="lessons-list"></div>
            </div>

            <div id="stats-tab" class="tab-content" style="display:none;">
                <div class="stats" id="stats-dashboard"></div>
            </div>
        </div>
    </div>
</div>

<!-- Machine Mode Modal -->
<div class="modal" id="machineModal">
    <div class="modal-content">
        <div class="modal-title">⚡ إضافة البيانات السريعة</div>

        <div id="machine-grades"></div>

        <div class="modal-buttons">
            <button class="btn-close" onclick="closeMachineMode()">إغلاق</button>
            <button class="btn-confirm" onclick="submitMachineMode()">إضافة</button>
        </div>
    </div>
</div>

<script>
const grades = ['5','6','7','8','9','10','11','12'];
const tools = {
    '5':['اختبار 1','اختبار 2','مشروع'],
    '6':['اختبار 1','اختبار 2','مشروع'],
    '7':['اختبار 1','اختبار 2','مشروع','عملي'],
    '8':['اختبار 1','اختبار 2','اختبار 3','مشروع'],
    '9':['اختبار 1','اختبار 2','اختبار 3','عملي'],
    '10':['اختبار 1','اختبار 2','اختبار 3','مشروع'],
    '11':['اختبار 1','اختبار 2','اختبار 3','مشروع','عملي'],
    '12':['اختبار 1','اختبار 2','اختبار 3','عملي']
};

let currentGrade = null;

document.addEventListener('DOMContentLoaded', function(){
    loadGrades();
});

function loadGrades(){
    const sidebar = document.getElementById('grades-sidebar');
    sidebar.innerHTML = '';

    grades.forEach(grade => {
        const div = document.createElement('div');
        div.className = 'grade';
        div.innerHTML = `
            <div class="grade-title">الصف ${grade}</div>
            <div class="section" onclick="selectGrade('${grade}')">الصف ${grade}</div>
        `;
        sidebar.appendChild(div);
    });

    selectGrade('5');
}

function selectGrade(grade){
    currentGrade = grade;
    document.getElementById('page-title').textContent = `الصف ${grade}`;

    loadLessons(grade);
    loadStats(grade);
}

function loadLessons(grade){
    const list = document.getElementById('lessons-list');
    const gradeLessons = tools[grade] || [];
    list.innerHTML = '';

    if(gradeLessons.length === 0){
        list.innerHTML = '<p>لا توجد دروس</p>';
        return;
    }

    gradeLessons.forEach((lesson, idx) => {
        const card = document.createElement('div');
        card.className = 'lesson-card';
        card.innerHTML = `
            <div class="lesson-row">
                <div class="lesson-title">
                    <input type="checkbox" id="lesson-${grade}-${idx}">
                    <label for="lesson-${grade}-${idx}">${lesson}</label>
                </div>
                <div style="font-size:12px;color:var(--muted);">0%</div>
            </div>
        `;
        list.appendChild(card);
    });
}

function loadStats(grade){
    const stats = document.getElementById('stats-dashboard');
    const gradeLessons = tools[grade] || [];

    if(gradeLessons.length === 0){
        stats.innerHTML = '<p>لا توجد إحصائيات</p>';
        return;
    }

    stats.innerHTML = gradeLessons.map(lesson => `
        <div class="stat-card">
            <div class="stat-title">${lesson}</div>
            <div class="stat-value">0%</div>
        </div>
    `).join('');
}

function switchTab(tab){
    document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
    document.getElementById(tab + '-tab').style.display = 'block';

    document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
    event.target.classList.add('active');
}

function openMachineMode(){
    const modal = document.getElementById('machineModal');
    const machine = document.getElementById('machine-grades');

    machine.innerHTML = grades.map(g => `
        <div class="form-group">
            <label>الصف ${g}</label>
            <input type="number" id="sections-${g}" placeholder="عدد الشعب" value="1" min="1">
        </div>
    `).join('');

    modal.classList.add('active');
}

function closeMachineMode(){
    document.getElementById('machineModal').classList.remove('active');
}

function submitMachineMode(){
    const data = {};
    grades.forEach(g => {
        const sections = parseInt(document.getElementById(`sections-${g}`).value) || 1;
        if(sections > 0){
            data[g] = sections;
        }
    });

    alert('✅ تمت إضافة: ' + Object.entries(data).map(([g,s]) => `الصف ${g} (${s} شعب)`).join(', '));
    closeMachineMode();
}

function openEditMode(){
    alert('✏️ وضع التعديل قريباً');
}

function logout(){
    if(confirm('تسجيل الخروج؟')){
        window.location.href = '/logout';
    }
}
</script>
</body>
</html>
