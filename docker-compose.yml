version: '3.9'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: teaching_user
      POSTGRES_PASSWORD: teaching_password
      POSTGRES_DB: teaching_monitor_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teaching_user -d teaching_monitor_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - teaching_network

  web:
    build: .
    environment:
      FLASK_ENV: development
      DATABASE_URL: postgresql://teaching_user:teaching_password@db:5432/teaching_monitor_db
      SECRET_KEY: dev-secret-key-not-for-production
      FLASK_DEBUG: "1"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - teaching_network
    command: >
      bash -c "
        flask db upgrade &&
        python -m flask run --host=0.0.0.0
      "

volumes:
  postgres_data:
    driver: local

networks:
  teaching_network:
    driver: bridge
